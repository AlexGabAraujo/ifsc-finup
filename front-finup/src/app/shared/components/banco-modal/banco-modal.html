<div
  class="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  (click)="fechar.emit()">

  <div
    class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 relative flex flex-col gap-5"
    (click)="$event.stopPropagation()">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between">
      <h2 class="text-var7 font-semibold text-lg">Contas bancárias</h2>
      <button
        (click)="fechar.emit()"
        class="text-gray-400 hover:text-gray-700 transition-colors focus:outline-none"
        aria-label="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Carregando -->
    @if (carregando) {
      <div class="flex justify-center py-6">
        <div class="w-7 h-7 border-4 border-var3 border-t-transparent rounded-full animate-spin"></div>
      </div>
    }

    <!-- Lista de itens conectados -->
    @if (!carregando) {
      @if (itens.length > 0) {
        <ul class="flex flex-col gap-3">
          @for (item of itens; track item.id) {
            <li class="flex items-center justify-between gap-3 p-3 rounded-xl bg-gray-50 border border-gray-100">
              <!-- Ícone + nome -->
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-var4 to-var3 flex items-center justify-center flex-shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l9-3 9 3v1H3V6zm0 3h18v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9z" />
                  </svg>
                </div>
                <span class="text-sm font-medium text-var7 truncate">{{ item.nomeInstituicao || 'Banco' }}</span>
              </div>

              <!-- Ações -->
              <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Sincronizar -->
                <button
                  (click)="sincronizar(item)"
                  [disabled]="sincronizando === item.id"
                  class="p-1.5 rounded-lg text-var3 hover:bg-var3/10 transition-colors focus:outline-none disabled:opacity-50"
                  title="Sincronizar transações">
                  @if (sincronizando === item.id) {
                    <div class="w-4 h-4 border-2 border-var3 border-t-transparent rounded-full animate-spin"></div>
                  } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  }
                </button>

                <!-- Reconectar (update widget) -->
                <button
                  (click)="reconectar(item)"
                  class="p-1.5 rounded-lg text-gray-400 hover:bg-gray-100 transition-colors focus:outline-none"
                  title="Reconectar">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                  </svg>
                </button>

                <!-- Desconectar -->
                <button
                  (click)="desconectar(item)"
                  [disabled]="desconectando === item.id"
                  class="p-1.5 rounded-lg text-red-400 hover:bg-red-50 transition-colors focus:outline-none disabled:opacity-50"
                  title="Desconectar">
                  @if (desconectando === item.id) {
                    <div class="w-4 h-4 border-2 border-red-400 border-t-transparent rounded-full animate-spin"></div>
                  } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                    </svg>
                  }
                </button>
              </div>
            </li>
          }
        </ul>
      } @else {
        <p class="text-sm text-gray-400 text-center py-2">Nenhuma conta conectada.</p>
      }

      <!-- Botão conectar novo banco -->
      <button
        (click)="abrirConectar.emit()"
        class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border-2 border-dashed border-var3/40 text-var3 text-sm font-medium hover:border-var3 hover:bg-var3/5 transition-all focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Conectar novo banco
      </button>
    }

  </div>
</div>
