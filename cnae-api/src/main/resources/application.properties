spring.config.import=optional:file:.env[.properties]
spring.application.name=cnae-api
server.port=${PORT:8081}

# Banco próprio da cnae-api (criado automaticamente se não existir)
spring.datasource.url=${CNAE_DB_URL:jdbc:mysql://localhost:3306/finup_cnae?createDatabaseIfNotExist=true}
spring.datasource.username=${CNAE_DB_USERNAME}
spring.datasource.password=${CNAE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
