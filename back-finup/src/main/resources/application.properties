spring.config.import=optional:file:.env[.properties]
spring.application.name=Fin-Up

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

jwt_secret=${JWT_SECRET}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

spring.ai.openai.api-key=${OPENAI_KEY}

CLIENT_ID_PLUGGY=${CLIENT_ID_PLUGGY}
CLIENT_SECRET_PLUGGY=${CLIENT_SECRET_PLUGGY}

# API do CNPJá (opcional — sem key usa limite de 5 req/min da API pública)
cnpja.api-key=${CNPJA_API_KEY:}


# cnae-api (projeto cnae-api, classifica o CNAE em classe principal e subclasse)
cnae.api.url=${CNAE_API_URL:http://localhost:8081}
