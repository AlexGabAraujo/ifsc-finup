spring.config.import=optional:file:.env[.properties]
spring.application.name=Fin-Up

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# As migrations usam timestamp como versão e nascem em branches diferentes: depois de um
# merge pode chegar uma migration "mais antiga" que a última já aplicada no banco local.
# Sem isso o Flyway recusa subir ("resolved migration not applied to database").
spring.flyway.out-of-order=true

jwt_secret=${JWT_SECRET}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

spring.ai.openai.api-key=${OPENAI_KEY}

CLIENT_ID_PLUGGY=${CLIENT_ID_PLUGGY}
CLIENT_SECRET_PLUGGY=${CLIENT_SECRET_PLUGGY}

cnpja.api-key=${CNPJA_API_KEY:}

# cnae-api (projeto cnae-api, classifica o CNAE em classe principal e subclasse)
# Sem CNAE_API_URL no .env, usa a porta local padrão da cnae-api (a mesma da coleção do Postman).
cnae.api.url=${CNAE_API_URL:http://localhost:8081}
